# Publie Résido sur GitHub Pages avec l'actualité du moment.
# Se lance à chaque push sur main, toutes les 30 minutes, et à la demande.
name: Publier Résido

on:
  push:
    branches: [main]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html icone-152.png icone-180.png CNAME _site/
          cp -R polices _site/
          cp -R illustrations _site/

      - name: Collecter l'actualité
        run: |
          python3 -m pip install --quiet "feedparser>=6,<7"
          python3 scripts/actualites.py _site/actualites.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5
