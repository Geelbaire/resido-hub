name: Publier Studio Franc Nord

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Préparer le Studio Franc Nord
        run: |
          mkdir -p _site
          cp index.html CNAME .nojekyll _site/
          cp -R studio _site/
          cp -R episodes _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5
